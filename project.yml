name: XinJi28
options:
  bundleIdPrefix: com.xinji28
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
packages: {}
targets:
  XinJi28:
    type: application
    platform: iOS
    sources:
      - path: XinJi28
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: XinJi28
        INFOPLIST_FILE: XinJi28/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - path: scripts/sync-config.sh
        name: Sync app-config.json
        basedOnDependencyAnalysis: false
      - path: scripts/sync-version.sh
        name: Sync version.properties
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false
