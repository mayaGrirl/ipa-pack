			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n# Read app-config.json (or app-config.example.json) and bake it into the iOS target.\nset -euo pipefail\n\nif [[ -n \"${SRCROOT:-}\" ]]; then\n  ROOT=\"$SRCROOT\"\nelse\n  ROOT=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\nfi\npython3 - \"$ROOT\" <<'PY'\nimport json, sys\nfrom pathlib import Path\n\nroot = Path(sys.argv[1])\nreal = root / \"app-config.json\"\ntemplate = root / \"app-config.example.json\"\nsource = real if real.exists() else template\nif not source.exists():\n    raise SystemExit(f\"缺少配置文件: {template}\")\ntry:\n    data = json.loads(source.read_text(encoding=\"utf-8\"))\nexcept json.JSONDecodeError as exc:\n    raise SystemExit(f\"壳包配置文件解析失败: {source.name}，请检查 JSON 格式 -> {exc}\") from exc\n\ndef config_str(key, default):\n    value = data.get(key)\n    return default if value is None else str(value)\n\ndef config_bool(key, default):\n    value = data.get(key)\n    if value is None:\n        return default\n    if isinstance(value, bool):\n        return value\n    return str(value).lower() == \"true\"\n\ndef config_int(key, default):\n    value = data.get(key)\n    return default if value is None else int(value)\n\napplication_id = config_str(\"application_id\", \"com.xj28a.app\")\napp_name = config_str(\"app_name\", \"新记\")\nweb_url = config_str(\"web_url\", \"https://test.kaixin28.com\")\nremote_config_url = config_str(\"remote_config_url\", \"\")\nenable_remote_url = config_bool(\"enable_remote_url\", True)\nremote_config_cache_hours = config_int(\"remote_config_cache_hours\", 1)\nshow_privacy = config_bool(\"show_privacy_on_first_launch\", True)\nprivacy_policy_url = config_str(\"privacy_policy_url\", \"\")\nshow_guide = config_bool(\"show_guide_on_first_launch\", True)\nenable_video = config_bool(\"enable_video_splash\", False)\nsplash_ms = config_int(\"splash_duration_ms\", 2500)\npull_to_refresh = config_bool(\"enable_pull_to_refresh\", True)\nuser_agent_name = config_str(\"user_agent_name\", \"XJ28App\")\n\ndef swift_str(value):\n    return value.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"')\n\ndef swift_bool(value):\n    return \"true\" if value else \"false\"\n\nswift = f'''import Foundation\n\n/// Generated by scripts/sync-config.sh from {source.name}. Do not edit by hand.\nenum AppConfig {{\n    static let applicationId = \"{swift_str(application_id)}\"\n    static let appName = \"{swift_str(app_name)}\"\n    static let webURL = \"{swift_str(web_url)}\"\n    static let remoteConfigURL = \"{swift_str(remote_config_url)}\"\n    static let enableRemoteURL = {swift_bool(enable_remote_url)}\n    static let remoteConfigCacheHours = {remote_config_cache_hours}\n    static let showPrivacyOnFirstLaunch = {swift_bool(show_privacy)}\n    static let privacyPolicyURL = \"{swift_str(privacy_policy_url)}\"\n    static let showGuideOnFirstLaunch = {swift_bool(show_guide)}\n    static let enableVideoSplash = {swift_bool(enable_video)}\n    static let splashDurationMs = {splash_ms}\n    static let enablePullToRefresh = {swift_bool(pull_to_refresh)}\n    static let userAgentName = \"{swift_str(user_agent_name)}\"\n}}\n'''\n(root / \"XinJi28\" / \"AppConfig.swift\").write_text(swift, encoding=\"utf-8\")\n\ndef xc_quote(value):\n    if any(ch.isspace() for ch in value) or any(ch in value for ch in '\"\\\\'):\n        escaped = value.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"')\n        return f'\"{escaped}\"'\n    return value\n\nxcconfig = f'''// Generated by scripts/sync-config.sh from {source.name}. Do not edit by hand.\n#include \"Version.xcconfig\"\nPRODUCT_BUNDLE_IDENTIFIER = {xc_quote(application_id)}\nAPP_DISPLAY_NAME = {xc_quote(app_name)}\nCODE_SIGN_STYLE = Automatic\n#include? \"Signing.xcconfig\"\n'''\n(root / \"Config\" / \"App.xcconfig\").write_text(xcconfig, encoding=\"utf-8\")\n\nif not real.exists():\n    print(f\">>> 提示: 未找到 app-config.json，正在使用模板 app-config.example.json\")\nprint(\n    f\">>> App 配置[{source.name}]: NAME={app_name} | ID={application_id} | \"\n    f\"WEB_URL={web_url} | REMOTE={str(enable_remote_url).lower()} | \"\n    f\"SHOW_PRIVACY={str(show_privacy).lower()} | SHOW_GUIDE={str(show_guide).lower()} | \"\n    f\"VIDEO_SPLASH={str(enable_video).lower()}\"\n)\nPY\n";
		};
